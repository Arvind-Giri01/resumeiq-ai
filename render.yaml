services:
  - type: web
    name: resumeiq-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYZE_RATE_LIMIT
        value: 5/minute
